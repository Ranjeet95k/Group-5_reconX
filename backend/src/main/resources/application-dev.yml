spring:
  application:
    name: reconx
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:reconx
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
logging:
  level:
    root: INFO
    com.dbtraining.reconx: DEBUG
    liquibase: INFO
